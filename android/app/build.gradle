plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adventurecard.atelier'
    compileSdk 34

    defaultConfig {
        applicationId 'com.adventurecard.atelier'
        minSdk 26
        targetSdk 34
        // A augmenter a chaque version : Android n'installe une mise a jour par-dessus
        // l'ancienne que si ce numero ne recule pas.
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Pas de bloc `dependencies` : le widget ne parle qu'au framework Android (RemoteViews,
// AlarmManager, HttpURLConnection, org.json). C'est ce qui garde l'APK a quelques Ko.
