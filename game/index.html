<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1726">
<title>Adventure Card</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="hero-chip">
      <img id="topPortrait" alt="">
      <div>
        <div id="topName">—</div>
        <div class="xpbar"><i id="topXp"></i></div>
      </div>
      <div id="topLevel" class="lvl">1</div>
    </div>
    <div id="contextCurrency" class="ctx-cur"></div>
  </header>

  <main id="screens">
    <section class="screen" id="screen-world">
      <canvas id="worldCanvas"></canvas>
      <div id="worldHint" class="world-hint"></div>
      <div id="joystick" class="joystick"><i></i></div>
      <div id="interactBtn" class="interact hidden">Entrer</div>
    </section>

    <section class="screen hidden" id="screen-farm"></section>
    <section class="screen hidden" id="screen-deck"></section>
    <section class="screen hidden" id="screen-bag"></section>
  </main>

  <nav id="nav">
    <button data-go="world" class="active"><span>🗺️</span>Carte</button>
    <button data-go="farm"><span>🌱</span>Ferme</button>
    <button data-go="deck"><span>🃏</span>Deck</button>
    <button data-go="bag"><span>🎒</span>Sac</button>
  </nav>

  <div id="battle" class="overlay hidden"></div>
  <div id="modal" class="overlay hidden"></div>
  <div id="toasts"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
