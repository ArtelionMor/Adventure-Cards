<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1726">
<title>Adventure Card</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="hero-chip">
      <img id="topPortrait" alt="">
      <div class="top-id">
        <div id="topName">—</div>
        <div class="xpbar"><i id="topXp"></i></div>
        <div id="topLevel" class="lvl">1</div>
      </div>
    </div>
    <div class="monnaies">
      <span class="m" id="topCoin"></span>
      <span class="m" id="topGem"></span>
    </div>
  </header>

  <!-- LE BANDEAU DE QUETE : la quete en cours, son toucher y emmene (src/ui/quetes.js, docs/TUTORIEL.md). -->
  <div id="quete" class="hidden"></div>

  <main id="screens">
    <section class="screen" id="screen-arene"></section>
    <section class="screen hidden" id="screen-boutique"></section>
    <section class="screen hidden" id="screen-encheres"></section>
    <section class="screen hidden" id="screen-farm"></section>
    <section class="screen hidden" id="screen-deck"></section>
    <section class="screen hidden" id="screen-packs"></section>
  </main>

  <!-- La navigation (maquette « Arena Screen », 19 octobre 2026) : un dessin par ecran, sans texte. main.js pose les
       icones (`data-ico`, ui/icones.js) ; l'ecran actif est une grande tuile jaune qui depasse vers le haut. -->
  <nav id="nav">
    <button data-go="encheres" data-ico="Farm" aria-label="Enchères"></button>
    <button data-go="arene" data-ico="Arena" aria-label="Combats" class="active"></button>
    <button data-go="boutique" data-ico="Coin" aria-label="Boutique"></button>
    <button data-go="deck" data-ico="Icon Deck" aria-label="Deck"></button>
    <button data-go="packs" data-ico="Booster" aria-label="Packs"></button>
  </nav>

  <!-- L'ECRAN DE CHARGEMENT : il charge les images du jeu, puis s'efface (src/ui/chargement.js). -->
  <div id="chargement">
    <img src="/game/vignettes/Graphical%20Assets/Icons/Icon.webp" alt="">
    <div class="chg-titre">Adventure Card</div>
    <div class="chg-barre"><i></i></div>
    <div class="chg-texte">Chargement…</div>
  </div>
  <div id="battle" class="overlay hidden"></div>
  <div id="modal" class="overlay hidden"></div>
  <div id="toasts"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
